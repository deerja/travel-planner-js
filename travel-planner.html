    const dateText=d=>new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(new Date(d+'T00:00:00'));
    function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,1800)}
    function openTripEditor(index=state.currentTrip){state.currentTrip=index;const f=$('#tripForm'),t=trip();Object.entries(t).forEach(([k,v])=>{if(f.elements[k]&&typeof v!=='object')f.elements[k].value=v});$('#tripDialog').showModal()}
    function showView(view){currentView=view;['home','trips','saved','info','planner'].forEach(v=>$('#'+v+'View').hidden=v!==view);$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')renderHome();if(view==='trips')renderTrips();if(view==='saved')renderSaved();if(view==='info')renderInfo();if(view==='planner')renderPlanner();window.scrollTo({top:0,behavior:'smooth'})}
    function renderTrips(){const root=$('#tripsView');root.innerHTML=`<header class="page-head"><div><p>여행 목록</p><h1>내 여행</h1><span>계획 중인 여행을 이어서 준비하세요.</span></div><button class="primary" id="createTrip">＋ 새 여행</button></header><div class="trip-grid">${state.trips.map((t,i)=>`<article class="trip-card" data-open-trip="${i}"><div><small>${esc(t.country)} · ${esc(t.city)}</small><h2>${esc(t.name)}</h2><p>${dateText(t.start)} - ${dateText(t.end)}</p></div><div class="trip-card-side"><span class="badge">${t.days.reduce((s,d)=>s+d.places.length,0)}개 장소</span><button class="icon-button" data-edit-trip="${i}" aria-label="${esc(t.name)} 수정">✎</button><span>→</span></div></article>`).join('')}</div>`;$('#createTrip').onclick=()=>$('#createDialog').showModal();$$('[data-open-trip]').forEach(card=>card.onclick=e=>{if(e.target.closest('[data-edit-trip]'))return;state.currentTrip=+card.dataset.openTrip;active=0;persist();showView('home')});$$('[data-edit-trip]').forEach(b=>b.onclick=()=>openTripEditor(+b.dataset.editTrip))}
    function renderHome(){const t=trip(),total=t.days.reduce((s,d)=>s+d.places.length,0),filled=t.days.filter(d=>d.places.length).length;$('#homeView').innerHTML=`<section class="hero"><span class="eyebrow">${esc(t.country)} · ${esc(t.city)}</span><h1>${esc(t.name)}</h1><div class="hero-meta"><span>${dateText(t.start)} - ${dateText(t.end)}</span><span class="badge">여행 준비 중</span></div><button class="icon-button hero-edit" id="homeEdit" aria-label="여행 수정">✎</button></section><section class="essentials"><button class="essential" id="flightEdit"><i>✈</i><span>항공</span><strong>${esc(t.flight)}</strong></button><button class="essential" id="stayEdit"><i>▣</i><span>숙소</span><strong>${esc(t.stay)}</strong></button></section><section class="section-card"><div class="section-head"><div><span class="eyebrow">여행 일정</span><h2>${t.days.length}일 중 ${filled}일의 일정을 만들었어요</h2><p>총 ${total}곳을 방문할 예정이에요.</p></div><button class="primary" id="openFirstDay">전체 일정 보기</button></div><div class="day-list">${t.days.map((d,i)=>`<article class="day-summary"><button class="day-summary-head" data-toggle-day="${i}"><div><span class="eyebrow">DAY ${d.day} · ${esc(d.date)}</span><h3>${esc(d.title)}</h3><p>${d.places.length?d.places.slice(0,3).map(p=>esc(p[1])).join(' · '):'아직 일정이 없어요'}</p></div><span>${d.places.length}곳　⌄</span></button><div class="day-summary-body" id="homeDay${i}" ${i?'hidden':''}>${d.places.map(p=>`<div class="mini-stop"><time>${esc(p[0])}</time><strong>${esc(p[1])}</strong></div>`).join('')||'<div class="mini-stop"><span></span><strong>장소를 추가해보세요.</strong></div>'}<button class="soft-button" data-open-day="${i}">DAY ${d.day} 상세 일정 보기</button> <button class="soft-button" data-rename-day="${i}">제목 수정</button></div></article>`).join('')}</div></section>`;$('#homeEdit').onclick=$('#flightEdit').onclick=$('#stayEdit').onclick=()=>openTripEditor();$('#openFirstDay').onclick=()=>{active=0;showView('planner')};$$('[data-toggle-day]').forEach(b=>b.onclick=()=>{const el=$('#homeDay'+b.dataset.toggleDay);el.hidden=!el.hidden});$$('[data-open-day]').forEach(b=>b.onclick=()=>{active=+b.dataset.openDay;selected=0;showView('planner')});$$('[data-rename-day]').forEach(b=>b.onclick=()=>{const d=t.days[+b.dataset.renameDay],name=prompt('DAY 제목을 입력해주세요.',d.title);if(name){d.title=name;persist();renderHome()}})}
    function renderSaved(){const t=trip();$('#savedView').innerHTML=`<header class="page-head"><div><p>장소 모음</p><h1>가고 싶은 곳</h1><span>날짜가 정해지면 일정에 바로 추가하세요.</span></div><button class="primary" id="newSaved">＋ 장소 추가</button></header><div class="saved-tabs"><button class="active">전체 장소</button><button>일정에 추가됨</button></div><div class="saved-grid">${t.saved.map((p,i)=>`<article class="saved-card"><i>⌖</i><div><span class="eyebrow">${esc(p[1])}</span><h3>${esc(p[0])}</h3><p>${esc(p[2])}</p></div>${p[3]==='scheduled'?'<span class="badge">추가됨</span>':`<select data-schedule-saved="${i}"><option value="">DAY에 추가</option>${t.days.map((d,j)=>`<option value="${j}">DAY ${d.day}</option>`).join('')}</select>`}</article>`).join('')||'<div class="empty">저장한 장소가 없어요.</div>'}</div>`;$('#newSaved').onclick=()=>{const name=prompt('저장할 장소 이름을 입력해주세요.');if(!name)return;const category=prompt('카테고리를 입력해주세요.','관광')||'기타';t.saved.push([name,category,t.city,'saved']);persist();renderSaved();toast('장소를 저장했어요')};$$('[data-schedule-saved]').forEach(s=>s.onchange=()=>{if(s.value==='')return;const p=t.saved[+s.dataset.scheduleSaved],d=t.days[+s.value];d.places.push(['미정',p[0],p[1],p[2],30+Math.random()*45,25+Math.random()*45]);p[3]='scheduled';persist();renderSaved();toast(`DAY ${d.day}에 추가했어요`)})}
    function renderInfo(){const t=trip();$('#infoView').innerHTML=`<header class="page-head"><div><p>여행 세부 정보</p><h1>여행 정보</h1><span>이동 중 필요한 정보를 한곳에서 확인하세요.</span></div><button class="primary" id="infoEdit">✎ 정보 수정</button></header><div class="info-grid"><section class="info-card"><span class="eyebrow">✈ 항공</span><h2>왕복 항공편</h2><div class="info-row"><span>항공편</span><strong>${esc(t.flight)}</strong></div><div class="info-row"><span>여행 기간</span><strong>${dateText(t.start)} - ${dateText(t.end)}</strong></div></section><section class="info-card"><span class="eyebrow">▣ 숙소</span><h2>${esc(t.stay)}</h2><div class="info-row"><span>주소</span><strong>${esc(t.stayAddress||'주소 미정')}</strong></div><div class="info-row"><span>체크인</span><strong>${dateText(t.start)}</strong></div></section><section class="info-card"><span class="eyebrow">₩ 예상 비용</span><h2>${Number(t.budget||0).toLocaleString()}원</h2><div class="info-row"><span>항공·숙박·일정</span><strong>여행 전체 예산</strong></div></section><section class="info-card"><span class="eyebrow">✓ 준비 상태</span><h2>핵심 정보 입력 완료</h2><div class="info-row"><span>일정</span><strong>${t.days.reduce((s,d)=>s+d.places.length,0)}개 장소</strong></div></section></div>`;$('#infoEdit').onclick=()=>openTripEditor()}
    function segment(a,b){const dx=b[4]-a[4],dy=b[5]-a[5];return{x:a[4],y:a[5],w:Math.hypot(dx,dy),r:Math.atan2(dy,dx)*180/Math.PI}}
    function drawPins(container,places,clickable=false){container.querySelectorAll('.route-line,.pin').forEach(n=>n.remove());places.slice(0,-1).map((p,i)=>segment(p,places[i+1])).forEach(s=>{const line=document.createElement('span');line.className='route-line';line.style.cssText=`left:${s.x}%;top:${s.y}%;width:${s.w}%;transform:rotate(${s.r}deg)`;container.append(line)});places.forEach((p,i)=>{const pin=document.createElement(clickable?'button':'span');pin.className='pin';pin.style.cssText=`left:${p[4]}%;top:${p[5]}%;${clickable?'border:0;background:transparent;cursor:pointer':''}`;pin.innerHTML=`<i>${i+1}</i><small>${esc(p[1])}</small>`;if(clickable)pin.onclick=()=>{selected=i;renderSelected()};container.append(pin)})}
    function renderSelected(){const p=trip().days[active].places[selected];if(!p){$('#selectedName').textContent='일정이 없어요';$('#selectedMeta').textContent='장소를 추가해주세요.';$('#selectedDirections').hidden=true;return}$('#selectedDirections').hidden=false;$('#selectedName').textContent=p[1];$('#selectedMeta').textContent=`${p[0]} · ${p[2]} · ${p[3]}`;$('#selectedDirections').onclick=()=>window.open(mapsUrl(p[1]),'_blank','noopener')}
    function renderPlanner(){const t=trip(),day=t.days[active]||t.days[0];active=t.days.indexOf(day);$('#headerName').textContent=t.name;$('#headerMeta').textContent=`${t.city} · DAY ${day.day}`;$('#dayKicker').textContent=`DAY ${day.day} · ${day.date}`;$('#dayTitle').textContent=day.title;$('#dayMeta').textContent=`장소 ${day.places.length}곳 · 시간 순서대로 바로 이동하세요`;$('#routeMeta').textContent=`${day.places.length}곳 · 총 이동 약 ${day.minutes}분`;$('#mapDay').textContent=`DAY ${day.day} 전체 루트`;$('#mapMeta').textContent=`장소 ${day.places.length}곳 · ${day.minutes}분`;$('#dayTabs').innerHTML=t.days.map((d,i)=>`<button class="day-tab ${i===active?'active':''}" data-i="${i}"><strong>DAY ${d.day}</strong><small>${esc(d.date)}</small></button>`).join('');$$('.day-tab').forEach(b=>b.onclick=()=>{active=+b.dataset.i;selected=0;renderPlanner()});$('#schedule').innerHTML=day.places.map((p,i)=>`<article class="stop ${i===0?'next':''}"><time>${esc(p[0])}</time><div class="axis"><span class="number">${i+1}</span></div><div class="place-row"><div class="place">${i===0?'<div class="status">다음 일정</div>':''}<h2>${esc(p[1])}</h2><p>${esc(p[2])} · ${esc(p[3])}</p></div><button class="directions" data-name="${esc(p[1])}">길찾기</button></div></article>`).join('')||'<div class="empty">이날의 일정이 아직 없어요.</div>';$$('#schedule .directions').forEach(b=>b.onclick=()=>window.open(mapsUrl(b.dataset.name),'_blank','noopener'));drawPins($('#miniMap'),day.places);drawPins($('#map'),day.places,true);renderSelected()}
    $('#editTrip').onclick=()=>openTripEditor();$('#tripForm .cancel').onclick=()=>$('#tripDialog').close();$('#tripForm').onsubmit=e=>{e.preventDefault();new FormData(e.currentTarget).forEach((v,k)=>trip()[k]=v);persist();$('#tripDialog').close();toast('여행 정보를 수정했어요');showView(currentView)};
    $('#createForm .cancel').onclick=()=>$('#createDialog').close();$('#createForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget));state.trips.push({...f,flight:'항공 미정',stay:'숙소 미정',stayAddress:'',budget:0,days:[{day:1,date:dateText(f.start),title:'첫날 일정',minutes:0,places:[]}],saved:[]});state.currentTrip=state.trips.length-1;active=0;persist();$('#createDialog').close();e.currentTarget.reset();toast('새 여행을 만들었어요');showView('home')};
    $('#editSchedule').onclick=()=>{editMode=!editMode;$('#editSchedule').textContent=editMode?'✓ 편집 완료':'✎ 일정 편집';$$('.place h2').forEach((h,i)=>{h.contentEditable=editMode;h.style.outline=editMode?'2px solid #eaf3ff':'none';h.onblur=()=>{trip().days[active].places[i][1]=h.textContent.trim()||trip().days[active].places[i][1];persist()}})};
    $('#addPlace').onclick=()=>{const name=prompt('추가할 장소 이름을 입력해주세요.');if(!name)return;const time=prompt('방문 시간을 입력해주세요.','미정')||'미정';trip().days[active].places.push([time,name,'기타',trip().city,30+Math.random()*45,25+Math.random()*45]);persist();renderPlanner();toast('일정에 장소를 추가했어요')};
    $('#downloadHtml').onclick=()=>{const copy=document.documentElement.cloneNode(true),notice=copy.querySelector('#toast');if(notice)notice.hidden=true;const source='<!doctype html>\n'+copy.outerHTML,blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='roamly-travel-planner.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('HTML 파일 다운로드를 시작했어요')};
    $$('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));showView('home');
  </script>
</body>
</html>
