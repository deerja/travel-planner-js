<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <title>Roamly · 내 여행</title>
  <style id="roamlyFoundation">
    /* ========================================
       ROAMLY DESIGN SYSTEM
       Based on SEED Foundation principles
    ======================================== */

    /* 01. Scale Tokens */
    :root {
      color-scheme: light;

      --scale-blue-100: #eaf3ff;
      --scale-blue-200: #d9eaff;
      --scale-blue-500: #3182f6;
      --scale-blue-600: #1b64da;
      --scale-blue-700: #174ea6;

      --scale-gray-00: #ffffff;
      --scale-gray-50: #f8f9fa;
      --scale-gray-100: #f2f4f6;
      --scale-gray-200: #e5e8eb;
      --scale-gray-300: #d1d6db;
      --scale-gray-400: #b0b8c1;
      --scale-gray-500: #8b95a1;
      --scale-gray-600: #66717f;
      --scale-gray-700: #4e5968;
      --scale-gray-800: #333d4b;
      --scale-gray-900: #191f28;

      --scale-red-100: #fff0f0;
      --scale-red-500: #e5484d;
      --scale-red-600: #d63b40;
      --scale-amber-500: #f59f00;
      --scale-amber-700: #8f5b00;
      --scale-sage-100: #dff1e8;
      --scale-sage-700: #22634b;
      --scale-rose-100: #f7e6ea;
      --scale-rose-700: #7b3f50;

      --font-family-sans: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-size-t2: 0.75rem;
      --font-size-t3: 0.8125rem;
      --font-size-t4: 0.875rem;
      --font-size-t5: 1rem;
      --font-size-t6: 1.125rem;
      --font-size-t7: 1.25rem;
      --font-size-t8: 1.375rem;
      --font-size-t9: 1.5rem;
      --font-size-t10: 1.625rem;
      --font-size-t11: 1.75rem;
      --font-size-t12: 2rem;
      --line-height-tight: 1.25;
      --line-height-base: 1.5;
      --line-height-relaxed: 1.65;
      --font-weight-regular: 400;
      --font-weight-medium: 600;
      --font-weight-bold: 700;

      --space-x0: 0;
      --space-x1: 0.25rem;
      --space-x2: 0.5rem;
      --space-x3: 0.75rem;
      --space-x4: 1rem;
      --space-x5: 1.25rem;
      --space-x6: 1.5rem;
      --space-x8: 2rem;
      --space-x10: 2.5rem;
      --space-x12: 3rem;
      --space-x16: 4rem;

      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-xl: 1.25rem;
      --radius-full: 9999px;

      --icon-size-sm: 1rem;
      --icon-size-md: 1.25rem;
      --icon-size-lg: 1.5rem;
      --stroke-width-thin: 1px;
    }

    /* 02. Semantic Tokens */
    :root {
      --fg-neutral: var(--scale-gray-900);
      --fg-neutral-subtle: var(--scale-gray-700);
      --fg-neutral-muted: var(--scale-gray-600);
      --fg-brand: var(--scale-blue-600);
      --fg-brand-pressed: var(--scale-blue-700);
      --fg-disabled: var(--scale-gray-400);
      --fg-critical: var(--scale-red-500);
      --fg-positive: var(--scale-sage-700);
      --fg-on-brand: var(--scale-gray-00);

      --bg-layer-default: var(--scale-gray-00);
      --bg-layer-floating: var(--scale-gray-00);
      --bg-canvas: var(--scale-gray-50);
      --bg-neutral-subtle: var(--scale-gray-100);
      --bg-neutral-weak: var(--scale-gray-50);
      --bg-brand-solid: var(--scale-blue-500);
      --bg-brand-solid-hover: var(--scale-blue-600);
      --bg-brand-solid-pressed: var(--scale-blue-700);
      --bg-brand-weak: var(--scale-blue-100);
      --bg-brand-weak-pressed: var(--scale-blue-200);
      --bg-critical-weak: var(--scale-red-100);
      --bg-critical-solid: var(--scale-red-500);
      --bg-critical-solid-pressed: var(--scale-red-600);
      --bg-positive-weak: var(--scale-sage-100);
      --bg-disabled: var(--scale-gray-100);
      --bg-inverse: var(--scale-gray-900);
      --bg-scrim: rgba(25, 31, 40, 0.48);
      --bg-trip-thumbnail: var(--scale-sage-100);
      --bg-trip-thumbnail-alternate: var(--scale-rose-100);
      --bg-image-scrim: rgba(25, 31, 40, 0.55);

      --stroke-neutral: var(--scale-gray-300);
      --stroke-neutral-subtle: var(--scale-gray-200);
      --stroke-brand: var(--scale-blue-500);
      --stroke-critical: var(--scale-red-500);
      --stroke-focus: var(--scale-blue-600);
      --fg-inverse: var(--scale-gray-00);
      --fg-rating: var(--scale-gray-700);
      --fg-rating-star: var(--scale-amber-500);
      --fg-rating-review: var(--scale-gray-500);
      --fg-trip-thumbnail: var(--scale-sage-700);
      --fg-trip-thumbnail-alternate: var(--scale-rose-700);

      --elevation-none: none;
      --elevation-raised: 0 0.0625rem 0.25rem rgba(25, 31, 40, 0.08);
      --elevation-floating: 0 0.25rem 1rem rgba(25, 31, 40, 0.1);
      --elevation-overlay: 0 1rem 3rem rgba(25, 31, 40, 0.2);

      --state-hover-overlay: rgba(25, 31, 40, 0.04);
      --state-pressed-overlay: rgba(25, 31, 40, 0.08);
      --state-selected-background: var(--bg-brand-weak);
      --state-selected-foreground: var(--fg-brand);
      --state-selected-stroke: var(--stroke-brand);
      --state-disabled-opacity: 0.42;
      --focus-ring-color: rgba(49, 130, 246, 0.28);
      --focus-ring-width: 0.1875rem;
      --focus-ring-offset: 0.125rem;
      --focus-ring: 0 0 0 var(--focus-ring-width) var(--focus-ring-color);
      --duration-fast: 120ms;
      --duration-normal: 180ms;
      --duration-slow: 240ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --transition-fast: var(--duration-fast) var(--ease-standard);
      --transition-base: var(--duration-normal) var(--ease-standard);
      --transition-slow: var(--duration-slow) var(--ease-standard);
    }

    /* 03. Typography Tokens */
    :root {
      --text-screen-title-size: var(--font-size-t12);
      --text-screen-title-line: var(--line-height-tight);
      --text-screen-title-weight: var(--font-weight-bold);
      --text-page-title-size: var(--font-size-t10);
      --text-page-title-line: var(--line-height-tight);
      --text-page-title-weight: var(--font-weight-bold);
      --text-section-title-size: var(--font-size-t8);
      --text-section-title-line: var(--line-height-tight);
      --text-section-title-weight: var(--font-weight-bold);
      --text-item-title-size: var(--font-size-t6);
      --text-item-title-line: var(--line-height-base);
      --text-item-title-weight: var(--font-weight-bold);
      --text-body-size: var(--font-size-t5);
      --text-body-line: var(--line-height-base);
      --text-body-weight: var(--font-weight-regular);
      --text-label-size: var(--font-size-t4);
      --text-label-line: var(--line-height-base);
      --text-label-weight: var(--font-weight-medium);
      --text-caption-size: var(--font-size-t3);
      --text-caption-line: var(--line-height-base);
      --text-caption-weight: var(--font-weight-regular);
      --text-hero-size: 2.5rem;
    }

    /* 04. Layout Tokens */
    :root {
      --layout-gutter-mobile: var(--space-x4);
      --layout-gutter-tablet: var(--space-x6);
      --layout-gutter-desktop: var(--space-x8);
      --content-width-detail: 54rem;
      --content-width-list: 70rem;
      --control-height-small: 2.25rem;
      --control-height-medium: 2.75rem;
      --control-height-large: 3.25rem;
      --control-min-height: 2.75rem;
      --bottom-nav-safe-area: env(safe-area-inset-bottom, 0px);
    }

    /* 05. Base / Reset */
    * {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      background: var(--bg-canvas);
      color: var(--fg-neutral);
      font-family: var(--font-family-sans);
      font-size: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: var(--space-x0);
      background: var(--bg-canvas);
      font-size: var(--text-body-size);
      font-weight: var(--text-body-weight);
      line-height: var(--text-body-line);
    }

    button,
    input,
    textarea,
    select {
      color: inherit;
      font: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    textarea:disabled,
    select:disabled {
      cursor: not-allowed;
      opacity: var(--state-disabled-opacity);
    }

    h1,
    h2,
    h3,
    p {
      margin: var(--space-x0);
    }

    :focus-visible {
      outline: var(--stroke-width-thin) solid var(--stroke-focus);
      outline-offset: var(--focus-ring-offset);
      box-shadow: var(--focus-ring);
    }

    [hidden] {
      display: none !important;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* 06. Shared UI Foundations */
    .shell,
    .detail-shell {
      width: min(100%, var(--content-width-list));
      margin-inline: auto;
      padding-inline: var(--layout-gutter-mobile);
    }

    .detail-shell {
      width: min(100%, var(--content-width-detail));
      padding-bottom: var(--space-x16);
    }

    .topbar,
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-x4);
      min-height: 4.5rem;
    }

    .topbar {
      padding-block: var(--space-x3);
    }

    .detail-header {
      z-index: 20;
      margin-inline: calc(var(--layout-gutter-mobile) * -1);
      padding: var(--space-x2) var(--layout-gutter-mobile);
      background: var(--bg-canvas);
    }

    .brand,
    .back {
      min-height: var(--control-min-height);
      padding-inline: var(--space-x2);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral);
      font-weight: var(--font-weight-bold);
    }

    .brand {
      color: var(--fg-brand);
      font-size: var(--font-size-t8);
      letter-spacing: -0.03em;
    }

    .back {
      font-size: var(--text-label-size);
    }

    .top-actions,
    .form-actions,
    .edit-tools {
      display: flex;
      align-items: center;
      gap: var(--space-x2);
    }

    /* 07. Components */

    .ui-button,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--control-height-medium);
      padding-inline: var(--space-x4);
      border: var(--stroke-width-thin) solid transparent;
      border-radius: var(--radius-md);
      background: var(--bg-brand-solid);
      color: var(--fg-on-brand);
      font-size: var(--text-label-size);
      font-weight: var(--text-label-weight);
      line-height: var(--text-label-line);
      transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .ui-button--solid,
    .btn:not(.secondary):not(.text) {
      background: var(--bg-brand-solid);
      color: var(--fg-on-brand);
    }

    .ui-button--weak {
      border-color: transparent;
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
    }

    .ui-button--neutral,
    .btn.secondary {
      border-color: var(--stroke-neutral-subtle);
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral);
    }

    .ui-button--ghost,
    .btn.text {
      background: transparent;
      color: var(--fg-neutral-subtle);
    }

    .btn.ui-button--ghost,
    .btn.secondary.ui-button--ghost,
    .btn.text.ui-button--ghost {
      border-color: transparent;
      background: transparent;
      color: var(--fg-neutral-subtle);
    }

    .ui-button--critical {
      background: var(--bg-critical-solid);
      color: var(--fg-on-brand);
    }

    .ui-button--small,
    .btn.small {
      min-height: var(--control-height-small);
      padding-inline: var(--space-x3);
      font-size: var(--text-caption-size);
    }

    .ui-button--large {
      min-height: var(--control-height-large);
      padding-inline: var(--space-x5);
    }

    .ui-button--fill {
      width: 100%;
    }

    .directions.ui-button--small {
      min-height: var(--control-height-small);
      font-size: var(--text-caption-size);
    }

    .add-place.ui-button--solid {
      border-color: transparent;
      background: var(--bg-brand-solid);
      color: var(--fg-on-brand);
    }

    .ui-button__icon {
      flex: 0 0 auto;
      width: var(--icon-size-sm);
      height: var(--icon-size-sm);
      margin-right: var(--space-x2);
    }

    .ui-icon-button,
    .modal-close.ui-icon-button,
    .edit-tools .ui-icon-button {
      display: inline-grid;
      width: var(--control-height-medium);
      height: var(--control-height-medium);
      min-width: var(--control-height-medium);
      padding: var(--space-x0);
      place-items: center;
      border: var(--stroke-width-thin) solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--icon-size-md);
      font-weight: var(--font-weight-medium);
      transition: background-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }

    .ui-icon-button--small,
    .edit-tools .ui-icon-button--small {
      width: var(--control-height-small);
      height: var(--control-height-small);
      min-width: var(--control-height-small);
      font-size: var(--icon-size-sm);
    }

    .ui-icon-button--neutral {
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral);
    }

    .ui-icon-button--critical,
    .edit-tools .ui-icon-button--critical {
      background: var(--bg-critical-weak);
      color: var(--fg-critical);
    }

    .ui-nav-action {
      display: inline-flex;
      align-items: center;
      min-height: var(--control-height-medium);
      padding-inline: var(--space-x2);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .ui-tabs {
      display: flex;
      gap: var(--space-x2);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .ui-tabs::-webkit-scrollbar {
      display: none;
    }

    .ui-tab {
      flex: 0 0 auto;
      min-height: var(--control-height-medium);
      border: var(--stroke-width-thin) solid transparent;
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }

    .ui-tab.ui-tab--chip {
      min-width: 5.25rem;
      padding: var(--space-x2) var(--space-x3);
      border-color: var(--stroke-neutral-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
    }

    .ui-tab.ui-tab--line {
      padding-inline: var(--space-x3);
      border-bottom-color: transparent;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .ui-tab[aria-selected="true"] {
      border-color: var(--state-selected-stroke);
      background: var(--state-selected-background);
      color: var(--state-selected-foreground);
    }

    .ui-tab.ui-tab--line[aria-selected="true"] {
      border-color: transparent transparent var(--state-selected-stroke);
      background: transparent;
    }

    .ui-badge,
    .dday.ui-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 1.75rem;
      padding-inline: var(--space-x3);
      border-radius: var(--radius-full);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      line-height: var(--text-caption-line);
      white-space: nowrap;
    }

    .ui-badge--neutral {
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral-subtle);
    }

    .ui-badge--brand,
    .dday.ui-badge--brand {
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
    }

    .ui-badge--positive {
      background: var(--bg-positive-weak);
      color: var(--fg-positive);
    }

    .ui-badge--critical {
      background: var(--bg-critical-weak);
      color: var(--fg-critical);
    }

    .ui-list {
      display: grid;
      margin: var(--space-x0);
      padding: var(--space-x0);
      list-style: none;
    }

    .ui-list-item {
      display: grid;
      min-width: 0;
      border-bottom: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
    }

    .ui-list-item:last-child {
      border-bottom: 0;
    }

    .ui-chip.ui-chip--selection,
    .ui-chip.ui-chip--map {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-height: var(--control-height-small);
      padding-inline: var(--space-x3);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-full);
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }

    .ui-chip[aria-pressed="true"],
    .ui-chip[aria-selected="true"] {
      border-color: var(--state-selected-stroke);
      background: var(--state-selected-background);
      color: var(--state-selected-foreground);
    }

    .ui-text-field,
    .ui-text-field.ui-text-field--form,
    .form .ui-text-field,
    .edit-tools .ui-text-field {
      width: 100%;
      min-height: var(--control-height-medium);
      padding: var(--space-x3) var(--space-x4);
      border: var(--stroke-width-thin) solid var(--stroke-neutral);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      font-size: var(--text-body-size);
      font-weight: var(--font-weight-regular);
      transition: background-color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .ui-text-field::placeholder {
      color: var(--fg-neutral-muted);
    }

    .ui-text-field[aria-invalid="true"],
    .ui-text-field.is-error {
      border-color: var(--stroke-critical);
      background: var(--bg-critical-weak);
    }

    .ui-search-field {
      position: relative;
      min-width: 0;
    }

    .ui-search-field::before {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: var(--space-x4);
      color: var(--fg-neutral-muted);
      content: "⌕";
      font-size: var(--icon-size-md);
      line-height: 1;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .ui-search-field .ui-text-field {
      padding-right: var(--space-x10);
      padding-left: var(--space-x10);
    }

    .ui-search-field__clear {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: var(--space-x1);
      transform: translateY(-50%);
    }

    .ui-dialog {
      border: 0;
      border-radius: var(--radius-xl);
      background: var(--bg-layer-floating);
      box-shadow: var(--elevation-overlay);
    }

    .ui-floating-sheet {
      border-radius: var(--radius-xl);
      background: var(--bg-layer-floating);
      box-shadow: var(--elevation-overlay);
    }

    .ui-map-action {
      isolation: isolate;
    }

    .ui-sheet-handle {
      display: none;
      width: var(--space-x10);
      height: var(--space-x1);
      margin: var(--space-x2) auto var(--space-x0);
      border-radius: var(--radius-full);
      background: var(--stroke-neutral);
    }

    .ui-snackbar,
    .toast.ui-snackbar {
      border-radius: var(--radius-md);
      background: var(--bg-inverse);
      color: var(--fg-inverse);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      box-shadow: var(--elevation-floating);
    }

    .toast.ui-snackbar {
      display: flex;
      align-items: center;
      gap: var(--space-x4);
    }

    .toast__message {
      min-width: 0;
    }

    .toast__action {
      flex: 0 0 auto;
      padding: var(--space-x1) var(--space-x2);
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--fg-brand-contrast, #8bbcff);
      font: inherit;
      font-weight: var(--font-weight-bold);
      cursor: pointer;
    }

    .toast__action[hidden] {
      display: none;
    }

    .ui-empty-state,
    .empty.ui-empty-state {
      display: grid;
      justify-items: center;
      padding: var(--space-x12) var(--space-x6);
      border: 0;
      border-radius: var(--radius-lg);
      background: var(--bg-neutral-subtle);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
      line-height: var(--text-caption-line);
      letter-spacing: 0.04em;
    }

    .section {
      margin-top: var(--space-x8);
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-x4);
      margin-bottom: var(--space-x4);
    }

    .section-title span {
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      line-height: var(--text-caption-line);
    }

    .section-title h2 {
      margin-top: var(--space-x1);
      font-size: var(--text-section-title-size);
      font-weight: var(--text-section-title-weight);
      line-height: var(--text-section-title-line);
      letter-spacing: -0.02em;
    }

    /* 08. Pages */
    .page-head {
      padding-block: var(--space-x12) var(--space-x8);
    }

    .page-head h1 {
      margin-top: var(--space-x2);
      font-size: var(--text-screen-title-size);
      font-weight: var(--text-screen-title-weight);
      line-height: var(--text-screen-title-line);
      letter-spacing: -0.035em;
    }

    .page-head p {
      margin-top: var(--space-x3);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-body-size);
      line-height: var(--line-height-base);
    }

    .trip-list {
      display: grid;
      gap: var(--space-x3);
      padding-bottom: var(--space-x16);
    }

    .trip-card {
      display: grid;
      grid-template-columns: 6.5rem minmax(0, 1fr) auto;
      gap: var(--space-x4);
      width: 100%;
      min-height: 8.5rem;
      padding: var(--space-x4);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      text-align: left;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .trip-thumb {
      display: grid;
      place-items: center;
      min-height: 6.5rem;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: linear-gradient(145deg, var(--bg-trip-thumbnail), var(--bg-layer-default));
      color: var(--fg-trip-thumbnail);
      font-size: var(--font-size-t9);
      font-weight: var(--font-weight-bold);
    }

    .trip-thumb.tokyo {
      background: linear-gradient(145deg, var(--bg-trip-thumbnail-alternate), var(--bg-layer-default));
      color: var(--fg-trip-thumbnail-alternate);
    }

    .trip-card h2 {
      margin-top: var(--space-x1);
      font-size: var(--text-item-title-size);
      font-weight: var(--text-item-title-weight);
      line-height: var(--text-item-title-line);
      letter-spacing: -0.02em;
    }

    .trip-card p {
      margin-top: var(--space-x1);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      line-height: var(--text-label-line);
    }

    .trip-card-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-x3);
    }

    .dday {
      display: inline-flex;
      align-items: center;
      min-height: 1.75rem;
      padding-inline: var(--space-x3);
      border-radius: var(--radius-full);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .cost {
      display: flex;
      align-items: baseline;
      gap: var(--space-x2);
      margin-top: var(--space-x3);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
    }

    .cost strong {
      color: var(--fg-neutral);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .arrow {
      color: var(--fg-neutral-muted);
      font-size: var(--icon-size-lg);
    }

    .empty {
      padding: var(--space-x12) var(--space-x6);
      border-radius: var(--radius-lg);
      background: var(--bg-neutral-subtle);
      text-align: center;
    }

    .empty h2 {
      font-size: var(--text-section-title-size);
      font-weight: var(--text-section-title-weight);
    }

    .empty p {
      margin: var(--space-x2) var(--space-x0) var(--space-x5);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
    }

    .trip-context-zone {
      margin-top: var(--space-x2);
      padding: var(--space-x8);
      border-radius: var(--radius-xl);
      background: var(--bg-layer-default);
    }

    .trip-summary h1 {
      margin-top: var(--space-x2);
      font-size: var(--text-screen-title-size);
      font-weight: var(--text-screen-title-weight);
      line-height: var(--text-screen-title-line);
      letter-spacing: -0.035em;
    }

    .trip-summary {
      padding-bottom: var(--space-x6);
    }

    .date-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-x3);
      margin-top: var(--space-x3);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
    }

    .compact-info {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding-top: var(--space-x5);
      border-top: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
    }

    .info-line {
      display: grid;
      grid-template-columns: var(--icon-size-lg) minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-content: center;
      gap: var(--space-x2);
      min-height: 4.875rem;
      padding: var(--space-x2) var(--space-x4);
      border-right: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
    }

    .info-line:first-child {
      padding-left: var(--space-x0);
    }

    .info-line:last-child {
      padding-right: var(--space-x0);
      border-right: 0;
    }

    .info-line strong {
      overflow: hidden;
      color: var(--fg-neutral);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-line strong.info-line-detail {
      display: grid;
      gap: 0.125rem;
      overflow: visible;
      line-height: var(--line-height-snug);
      text-overflow: initial;
      white-space: normal;
    }

    .info-line-detail > span {
      align-self: auto;
    }

    .info-line-detail small {
      color: var(--fg-neutral-muted);
      font-size: var(--font-size-t2);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-normal);
    }

    .info-line span {
      align-self: end;
    }

    .info-icon {
      display: grid;
      width: var(--icon-size-lg);
      height: var(--icon-size-lg);
      place-items: center;
      color: var(--fg-neutral-subtle);
      font-size: var(--icon-size-md);
      font-style: normal;
      grid-row: 1 / 3;
    }

    .day-section {
      margin-top: var(--space-x0);
      padding-top: var(--space-x2);
    }

    .day-sticky {
      position: sticky;
      z-index: 15;
      top: 0;
      margin-inline: calc(var(--layout-gutter-mobile) * -1);
      padding: var(--space-x2) var(--layout-gutter-mobile);
      background: color-mix(in srgb, var(--bg-canvas) 94%, transparent);
      backdrop-filter: blur(0.75rem);
    }

    .day-selector {
      display: flex;
      gap: var(--space-x2);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .day-selector::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      flex: 0 0 auto;
      min-width: 5.25rem;
      min-height: var(--control-min-height);
      padding: var(--space-x2) var(--space-x3);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
      color: var(--fg-neutral-subtle);
      text-align: left;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
    }

    .day-tab.active {
      border-color: var(--state-selected-stroke);
      background: var(--state-selected-background);
      box-shadow: var(--elevation-raised);
      color: var(--state-selected-foreground);
    }

    .route-preview {
      position: relative;
      height: 17.5rem;
      overflow: hidden;
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-neutral-subtle);
      cursor: pointer;
    }

    .route-preview::after {
      position: absolute;
      z-index: 500;
      top: var(--space-x3);
      right: var(--space-x3);
      display: inline-flex;
      align-items: center;
      min-height: 2.125rem;
      padding-inline: var(--space-x3);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--bg-layer-floating) 94%, transparent);
      box-shadow: var(--elevation-floating);
      color: var(--fg-neutral-subtle);
      content: "⛶ 크게 보기";
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
    }

    .route-preview.is-empty {
      cursor: default;
    }

    .route-preview.is-empty::before {
      position: absolute;
      z-index: 500;
      inset: 0;
      display: grid;
      padding: var(--space-x6);
      place-items: center;
      background: color-mix(in srgb, var(--bg-layer-default) 82%, transparent);
      color: var(--fg-neutral-subtle);
      content: "장소를 추가하면 이동 경로가 여기에 표시돼요";
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      text-align: center;
    }

    .route-preview.is-empty::after {
      display: none;
    }

    .map-fallback {
      display: grid;
      height: 100%;
      place-items: center;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
    }

    .route-marker {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      border: 0.1875rem solid var(--bg-layer-default);
      border-radius: var(--radius-full);
      background: var(--bg-brand-solid);
      box-shadow: var(--elevation-floating);
      color: var(--fg-on-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .route-marker.selected {
      background: var(--bg-brand-solid-pressed);
      box-shadow: 0 0 0 var(--space-x1) var(--bg-brand-weak), var(--elevation-floating);
      transform: scale(1.08);
    }

    .timeline {
      display: grid;
      gap: var(--space-x0);
      margin-top: var(--space-x2);
    }

    .timeline-row {
      display: grid;
      position: relative;
      grid-template-columns: 6.25rem minmax(0, 1fr) auto;
      align-items: start;
      min-height: 5.875rem;
      padding-block: var(--space-x1);
      border-bottom: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
    }

    .timeline-meta {
      display: flex;
      grid-column: 1;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-x2);
      padding-top: var(--space-x1);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      font-variant-numeric: tabular-nums;
    }

    .timeline-meta time {
      padding-top: var(--space-x1);
    }

    .timeline-meta::after {
      position: absolute;
      top: 2rem;
      bottom: 0;
      left: 5.4375rem;
      width: var(--stroke-width-thin);
      background: var(--stroke-neutral);
      content: "";
    }

    .timeline-row:last-of-type .timeline-meta::after {
      display: none;
    }

    .order {
      display: grid;
      width: 2rem;
      height: 2rem;
      place-items: center;
      border-radius: var(--radius-full);
      background: var(--bg-brand-solid);
      color: var(--fg-on-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
      flex: 0 0 2rem;
    }

    .place-copy {
      grid-column: 2;
      min-width: 0;
      padding: var(--space-x0) var(--space-x3) var(--space-x5) var(--space-x3);
    }

    .place-copy h3 {
      overflow: hidden;
      font-size: var(--text-item-title-size);
      font-weight: var(--text-item-title-weight);
      line-height: var(--text-item-title-line);
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-copy p {
      overflow: hidden;
      margin-top: var(--space-x1);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      line-height: var(--text-label-line);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .directions {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--control-min-height);
      padding-inline: var(--space-x3);
      border-radius: var(--radius-md);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
      grid-column: 3;
    }

    .travel-row {
      display: grid;
      grid-template-columns: 6.25rem minmax(0, 1fr);
      align-items: center;
      min-height: 2.5rem;
      margin-top: calc(var(--space-x5) * -1);
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
    }

    .travel-line {
      justify-self: center;
      width: var(--stroke-width-thin);
      height: 100%;
      min-height: 2rem;
      background: var(--stroke-neutral);
      margin-right: var(--space-x3);
    }

    .edit-tools {
      grid-column: 2 / -1;
      justify-content: flex-end;
      margin-top: var(--space-x2);
    }

    .add-place {
      width: calc(100% - 6.25rem);
      min-height: var(--control-min-height);
      margin: var(--space-x4) var(--space-x0) var(--space-x0) 6.25rem;
      border: var(--stroke-width-thin) dashed var(--stroke-brand);
      border-radius: var(--radius-md);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .map-screen {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg-layer-default);
    }

    .map-screen[hidden] {
      display: none;
    }

    .map-screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-x3);
      min-height: 4rem;
      padding: var(--space-x2) var(--layout-gutter-mobile);
      border-bottom: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      background: var(--bg-layer-floating);
    }

    .map-screen-header h1 {
      overflow: hidden;
      font-size: var(--text-item-title-size);
      font-weight: var(--text-item-title-weight);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .full-map {
      min-height: 0;
    }

    .map-place-sheet {
      position: absolute;
      z-index: 101;
      right: var(--layout-gutter-mobile);
      bottom: calc(var(--space-x4) + var(--bottom-nav-safe-area));
      left: var(--layout-gutter-mobile);
      max-width: 32rem;
      max-height: 45vh;
      margin-inline: auto;
      overflow: auto;
      padding: var(--space-x4);
      border-radius: var(--radius-xl);
      background: var(--bg-layer-floating);
      box-shadow: var(--elevation-overlay);
    }

    .map-place-sheet > span {
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .map-place-sheet h2 {
      margin-top: var(--space-x1);
      font-size: var(--text-section-title-size);
      font-weight: var(--text-section-title-weight);
    }

    .map-place-sheet p {
      margin-top: var(--space-x1);
      padding-right: 7.5rem;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
    }

    .map-place-sheet .directions {
      position: absolute;
      top: var(--space-x5);
      right: var(--space-x4);
    }

    .map-stop-list {
      position: absolute;
      z-index: 101;
      top: 4.75rem;
      left: 50%;
      display: flex;
      gap: var(--space-x2);
      width: min(35rem, calc(100% - (var(--layout-gutter-mobile) * 2)));
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding: var(--space-x2);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--bg-layer-floating) 94%, transparent);
      box-shadow: var(--elevation-floating);
      transform: translateX(-50%);
      scrollbar-width: none;
    }

    .map-stop-list::-webkit-scrollbar {
      display: none;
    }

    .map-stop-list button {
      flex: 0 0 auto;
      min-height: var(--control-min-height);
      padding-inline: var(--space-x3);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      text-align: left;
      white-space: nowrap;
    }

    .map-stop-list button.active {
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
    }

    dialog {
      width: min(calc(100% - (var(--layout-gutter-mobile) * 2)), 36rem);
      max-height: min(88vh, 48rem);
      overflow: auto;
      padding: var(--space-x0);
      border: 0;
      border-radius: var(--radius-xl);
      background: var(--bg-layer-floating);
      color: var(--fg-neutral);
      box-shadow: var(--elevation-overlay);
    }

    dialog::backdrop {
      background: var(--bg-scrim);
      backdrop-filter: blur(0.125rem);
    }

    .modal {
      padding: var(--space-x6);
    }

    .modal-head {
      margin-bottom: var(--space-x5);
      padding-right: var(--space-x10);
    }

    .modal-head span {
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .modal-head h2 {
      margin-top: var(--space-x1);
      font-size: var(--text-section-title-size);
      font-weight: var(--text-section-title-weight);
    }

    .modal-close {
      position: absolute;
      top: var(--space-x4);
      right: var(--space-x4);
      display: grid;
      width: var(--control-min-height);
      height: var(--control-min-height);
      place-items: center;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--icon-size-lg);
    }

    .form {
      display: grid;
      gap: var(--space-x4);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-x4);
    }

    .form label {
      display: grid;
      gap: var(--space-x2);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--text-label-weight);
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      min-height: var(--control-min-height);
      padding: var(--space-x3) var(--space-x4);
      border: var(--stroke-width-thin) solid var(--stroke-neutral);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      font-size: var(--text-body-size);
      font-weight: var(--font-weight-regular);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 2fr;
      margin-top: var(--space-x2);
    }

    .sheet-tabs,
    .category-chips {
      display: flex;
      gap: var(--space-x2);
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
    }

    .sheet-tabs {
      margin-bottom: var(--space-x4);
    }

    .sheet-tabs::-webkit-scrollbar,
    .category-chips::-webkit-scrollbar {
      display: none;
    }

    .sheet-tabs button,
    .category-chips button {
      flex: 0 0 auto;
      min-height: var(--control-min-height);
      padding-inline: var(--space-x3);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-full);
      background: var(--bg-layer-default);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .sheet-tabs button.active,
    .category-chips button.active {
      border-color: var(--state-selected-stroke);
      background: var(--state-selected-background);
      color: var(--state-selected-foreground);
    }

    .search-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-x2);
      margin-bottom: var(--space-x4);
    }

    .search-form input {
      min-width: 0;
      min-height: var(--control-min-height);
      padding-inline: var(--space-x4);
      border: var(--stroke-width-thin) solid var(--stroke-neutral);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
    }

    .place-search {
      width: 100%;
    }

    .search-submit {
      min-width: var(--control-min-height);
    }

    .quick-find {
      margin-top: var(--space-x4);
    }

    .quick-find > strong,
    .result-head > strong {
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .category-chips {
      margin-top: var(--space-x3);
    }

    .place-results {
      display: grid;
      gap: var(--space-x2);
      margin-top: var(--space-x4);
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-x3);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      margin-bottom: var(--space-x2);
    }

    .place-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-x3);
      width: 100%;
      min-height: 4.5rem;
      padding: var(--space-x3) var(--space-x4);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      text-align: left;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .place-result h3 {
      display: block;
      margin: var(--space-x0);
      font-size: var(--text-body-size);
      font-weight: var(--font-weight-bold);
    }

    .place-result small,
    .provider-note {
      display: block;
      margin-top: var(--space-x1);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      line-height: var(--text-caption-line);
    }

    .place-result-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.375rem;
      margin-top: 0.125rem;
    }

    .place-result-meta p {
      color: var(--fg-neutral-subtle);
      font-size: var(--font-size-t2);
      line-height: var(--line-height-base);
    }

    .place-rating {
      display: inline-flex;
      align-items: center;
      gap: 0.1875rem;
      color: var(--fg-rating);
      font-size: var(--font-size-t2);
      font-weight: var(--font-weight-medium);
      line-height: var(--line-height-base);
      white-space: nowrap;
    }

    .place-rating__star {
      color: var(--fg-rating-star);
      font-size: var(--text-caption-size);
      line-height: 1;
    }

    .place-rating__reviews {
      color: var(--fg-rating-review);
      font-weight: var(--font-weight-regular);
    }

    .search-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-x2);
      min-height: 5rem;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
    }

    .search-loading::before {
      width: var(--icon-size-md);
      height: var(--icon-size-md);
      border: 0.125rem solid var(--stroke-neutral);
      border-top-color: var(--stroke-brand);
      border-radius: var(--radius-full);
      content: "";
      animation: spin 0.8s linear infinite;
    }

    .toast {
      position: fixed;
      z-index: 200;
      right: var(--layout-gutter-mobile);
      bottom: calc(var(--space-x6) + var(--bottom-nav-safe-area));
      left: var(--layout-gutter-mobile);
      width: fit-content;
      max-width: calc(100% - (var(--layout-gutter-mobile) * 2));
      margin-inline: auto;
      padding: var(--space-x3) var(--space-x4);
      border: 0;
      border-radius: var(--radius-full);
      background: var(--bg-inverse);
      box-shadow: var(--elevation-floating);
      color: var(--fg-inverse);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Roamly Product Patterns */
    .roamly-trip-context {
      background: var(--bg-layer-default);
    }

    .roamly-route-map {
      overflow: hidden;
    }

    .roamly-place-discovery {
      color: var(--fg-neutral);
    }

    .dev-utility {
      display: none;
    }

    .trips-shell .topbar {
      min-height: 5rem;
    }

    .my-trips-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--space-x8);
      padding-block: var(--space-x12) var(--space-x10);
    }

    .my-trips-head p {
      max-width: 30rem;
    }

    .roamly-trip-card h2 {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .roamly-trip-list {
      gap: var(--space-x6);
    }

    .roamly-trip-card {
      position: relative;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 10rem auto;
      gap: var(--space-x0);
      min-height: 19rem;
      overflow: hidden;
      padding: var(--space-x0);
      border: 0;
      border-radius: var(--radius-xl);
      background: var(--bg-layer-default);
    }

    .roamly-trip-card .trip-thumb {
      position: relative;
      grid-column: 1 / -1;
      min-height: 10rem;
      padding: var(--space-x6);
      place-items: end start;
      border-radius: var(--space-x0);
      background: linear-gradient(135deg, var(--scale-sage-700), var(--scale-sage-100));
      color: var(--fg-inverse);
      isolation: isolate;
    }

    .roamly-trip-card .trip-thumb::before,
    .roamly-trip-card .trip-thumb::after {
      position: absolute;
      z-index: -1;
      border-radius: var(--radius-full);
      background: color-mix(in srgb, var(--bg-layer-default) 20%, transparent);
      content: "";
    }

    .roamly-trip-card .trip-thumb::before {
      top: -5rem;
      right: -2rem;
      width: 14rem;
      height: 14rem;
    }

    .roamly-trip-card .trip-thumb::after {
      right: 8rem;
      bottom: -5rem;
      width: 10rem;
      height: 10rem;
    }

    .roamly-trip-card .trip-thumb.tokyo {
      background: linear-gradient(135deg, var(--scale-rose-700), var(--scale-rose-100));
      color: var(--fg-inverse);
    }

    .roamly-trip-card .trip-thumb img {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .roamly-trip-card .trip-thumb.has-image::before {
      inset: 0;
      width: auto;
      height: auto;
      border-radius: var(--space-x0);
      background: linear-gradient(180deg, transparent, var(--bg-image-scrim));
    }

    .roamly-trip-card .trip-thumb span {
      font-size: var(--text-section-title-size);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.04em;
    }

    .roamly-trip-card .trip-thumb small {
      margin-left: var(--space-x2);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      opacity: 0.78;
    }

    .roamly-trip-card > div:nth-child(2) {
      min-width: 0;
      padding: var(--space-x5) var(--space-x0) var(--space-x6) var(--space-x6);
    }

    .roamly-trip-card .trip-card-side {
      grid-column: 2;
      padding: var(--space-x5) var(--space-x6) var(--space-x6) var(--space-x4);
    }

    .roamly-trip-card h2 {
      margin-top: var(--space-x2);
      font-size: var(--text-section-title-size);
    }

    .roamly-trip-card .cost {
      margin-top: var(--space-x4);
    }

    .detail-header {
      min-height: 4.5rem;
      border-bottom: 0;
    }

    .trip-context-zone {
      margin-top: var(--space-x2);
      padding: var(--space-x6);
      border-radius: var(--radius-xl);
      background: var(--bg-layer-default);
    }

    .trip-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: start;
      gap: var(--space-x2) var(--space-x4);
      padding-bottom: var(--space-x4);
    }

    .trip-summary .eyebrow {
      grid-row: 1;
      grid-column: 1;
      align-self: center;
    }

    .trip-summary h1 {
      grid-row: 2;
      grid-column: 1 / -1;
      max-width: 40rem;
      margin-top: var(--space-x0);
      font-size: var(--text-hero-size);
      line-height: 1.12;
    }

    .trip-summary .date-line {
      grid-row: 1;
      grid-column: 2;
      justify-content: flex-end;
      margin-top: var(--space-x0);
      white-space: nowrap;
    }

    .trip-summary .dday {
      min-height: 1.625rem;
      padding-inline: var(--space-x2);
    }

    .trip-info-accordion {
      border-top: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
    }

    .trip-info-accordion summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-x4);
      min-height: var(--control-height-large);
      padding-block: var(--space-x2);
      border-radius: var(--radius-md);
      color: var(--fg-neutral);
      cursor: pointer;
      list-style: none;
    }

    .trip-info-accordion summary::-webkit-details-marker {
      display: none;
    }

    .trip-info-summary__label {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: var(--space-x3);
    }

    .trip-info-summary__label strong {
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-bold);
      white-space: nowrap;
    }

    .trip-info-summary__label span {
      overflow: hidden;
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trip-info-summary__action {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-x1);
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
    }

    .trip-info-summary__action i {
      font-style: normal;
      transition: transform var(--transition-fast);
    }

    .trip-info-action__open {
      display: none;
    }

    .trip-info-accordion[open] .trip-info-action__closed {
      display: none;
    }

    .trip-info-accordion[open] .trip-info-action__open {
      display: inline;
    }

    .trip-info-accordion[open] .trip-info-summary__action i {
      transform: rotate(180deg);
    }

    .compact-info {
      padding-top: var(--space-x3);
      border-top: 0;
    }

    .info-line {
      min-height: 4.5rem;
    }

    .roamly-day-navigation {
      margin-top: var(--space-x8);
    }

    .day-sticky {
      padding-block: var(--space-x2);
      border-bottom: 0;
      background: color-mix(in srgb, var(--bg-canvas) 98%, transparent);
    }

    .day-tab.ui-tab--chip {
      display: inline-flex;
      min-width: auto;
      min-height: var(--control-height-medium);
      align-items: center;
      gap: var(--space-x2);
      padding-inline: var(--space-x4);
      border-color: var(--stroke-neutral-subtle);
      border-radius: var(--radius-full);
      background: var(--bg-layer-default);
      color: var(--fg-neutral-subtle);
      text-align: center;
    }

    .day-tab__date {
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-bold);
      white-space: nowrap;
    }

    .day-tab__day {
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .day-tab.ui-tab--chip[aria-selected="true"] {
      border-color: var(--stroke-brand);
      background: var(--bg-brand-weak);
      box-shadow: var(--elevation-none);
      color: var(--fg-brand);
    }

    .day-tab.ui-tab--chip[aria-selected="true"] .day-tab__day {
      color: var(--fg-brand);
    }

    .roamly-journey-overview {
      margin-top: var(--space-x3);
    }

    .route-preview {
      height: 22rem;
      border: 0;
      border-radius: var(--radius-xl);
      box-shadow: var(--elevation-none);
    }

    .route-preview::after {
      top: auto;
      right: var(--space-x4);
      bottom: var(--space-x4);
    }

    .route-marker {
      background: var(--bg-inverse);
    }

    .route-marker.selected {
      background: var(--bg-brand-solid);
    }

    .roamly-schedule {
      margin-top: var(--space-x16);
    }

    .roamly-schedule > .section-title {
      margin-bottom: var(--space-x5);
    }

    .schedule-heading {
      align-items: center;
    }

    .schedule-title {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: var(--space-x2);
    }

    .schedule-title span {
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
      white-space: nowrap;
    }

    .schedule-edit-button.ui-button--weak {
      flex: 0 0 auto;
    }

    .add-place.ui-button--solid {
      width: 100%;
      margin: var(--space-x6) var(--space-x0) var(--space-x0);
      border: 0;
    }

    .roamly-schedule .timeline {
      gap: var(--space-x4);
    }

    .day-tab {
      position: relative;
    }

    .day-tab__today {
      display: inline-flex;
      align-items: center;
      margin-left: var(--space-x1);
      color: var(--fg-brand);
      font-size: var(--font-size-t2);
      font-weight: var(--font-weight-bold);
    }

    .schedule-title__context {
      color: var(--fg-brand);
    }

    .schedule-entry {
      display: grid;
      min-width: 0;
    }

    .roamly-schedule-item {
      grid-template-columns: 4.5rem minmax(0, 1fr);
      align-items: start;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .roamly-schedule-item .timeline-meta {
      grid-row: 1;
      grid-column: 1;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: var(--space-x2);
      padding-top: var(--space-x4);
    }

    .roamly-schedule-item .timeline-meta time {
      padding-top: var(--space-x0);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-semibold);
    }

    .roamly-schedule-item .timeline-meta::after {
      display: none;
    }

    .roamly-schedule-item .order {
      width: var(--space-x7);
      height: var(--space-x7);
      flex-basis: var(--space-x7);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--font-size-t2);
      font-weight: var(--font-weight-bold);
    }

    .schedule-card {
      display: grid;
      grid-row: 1;
      grid-column: 2;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-width: 0;
      min-height: 5.5rem;
      padding: var(--space-x5);
      border-radius: var(--radius-lg);
      background: var(--bg-layer-default);
      box-shadow: 0 0.1875rem 1rem rgba(25, 31, 40, 0.065);
      transition: background-color var(--transition-base), box-shadow var(--transition-base), transform var(--transition-base);
    }

    .roamly-schedule-item.is-next .schedule-card {
      background: color-mix(in srgb, var(--bg-brand-weak) 42%, var(--bg-layer-default));
      box-shadow: inset 0.1875rem 0 0 var(--stroke-brand), 0 0.1875rem 1rem rgba(25, 31, 40, 0.055);
    }

    .roamly-schedule-item.is-past .place-copy {
      opacity: 0.68;
    }

    .roamly-schedule-item.is-recently-added .schedule-card {
      animation: schedule-added 1.6s ease-out;
    }

    .next-schedule-badge {
      display: inline-flex;
      grid-column: 1 / -1;
      justify-self: start;
      margin-bottom: var(--space-x2);
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .schedule-card.has-status .place-copy,
    .schedule-card.has-status .directions {
      grid-row: 2;
    }

    .schedule-complete {
      margin-left: auto;
      color: var(--fg-neutral-subtle);
    }

    .roamly-schedule-item .place-copy {
      grid-row: 1;
      grid-column: 1;
      padding: var(--space-x0) var(--space-x4) var(--space-x0) var(--space-x0);
    }

    .roamly-schedule-item .place-copy h3 {
      display: -webkit-box;
      overflow: hidden;
      font-size: var(--text-item-title-size);
      text-overflow: initial;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .roamly-schedule-item .directions {
      grid-row: 1;
      grid-column: 2;
      align-self: center;
    }

    .directions {
      gap: var(--space-x2);
    }

    .directions__icon {
      width: var(--icon-size-sm);
      height: var(--icon-size-sm);
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .roamly-travel-segment {
      display: flex;
      min-height: var(--control-height-medium);
      align-items: center;
      justify-content: center;
      margin-top: var(--space-x0);
      margin-left: 4.5rem;
      text-align: center;
    }

    .roamly-travel-segment .travel-line {
      display: none;
    }

    .travel-segment__content {
      display: inline-flex;
      align-items: center;
      gap: var(--space-x2);
    }

    .travel-segment__content i {
      color: var(--fg-neutral-muted);
      font-style: normal;
    }

    .roamly-schedule-item .edit-tools {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-x3);
      margin-top: var(--space-x4);
      padding: var(--space-x4);
      border-radius: var(--radius-md);
      background: var(--bg-neutral-subtle);
    }

    .edit-time-button,
    .edit-delete-button {
      white-space: nowrap;
    }

    .drag-handle {
      display: inline-grid;
      width: var(--control-height-medium);
      height: var(--control-height-medium);
      place-items: center;
      border-radius: var(--radius-md);
      color: var(--fg-neutral-muted);
      font-size: var(--text-item-title-size);
      cursor: grab;
      user-select: none;
    }

    .edit-reorder-actions {
      display: flex;
      gap: var(--space-x1);
    }

    .edit-more {
      position: relative;
      grid-column: 1 / -1;
    }

    .edit-more > summary {
      display: grid;
      width: var(--control-height-medium);
      height: var(--control-height-medium);
      place-items: center;
      border-radius: var(--radius-md);
      color: var(--fg-neutral);
      cursor: pointer;
      font-size: var(--text-item-title-size);
      font-weight: var(--font-weight-bold);
      list-style: none;
      margin-left: auto;
    }

    .edit-more > summary::-webkit-details-marker {
      display: none;
    }

    .edit-secondary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-x3);
      margin-top: var(--space-x3);
      padding-top: var(--space-x3);
      border-top: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
    }

    .edit-field {
      display: grid;
      min-width: 0;
      gap: var(--space-x1);
    }

    .edit-field > span {
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-medium);
    }

    .edit-field .ui-text-field {
      min-width: 0;
      min-height: var(--control-height-medium);
      padding: var(--space-x2) var(--space-x3);
      background: var(--bg-layer-default);
      font-size: var(--text-label-size);
    }

    .time-dialog {
      width: min(22rem, calc(100% - (var(--layout-gutter-mobile) * 2)));
    }

    .time-dialog .modal {
      padding: var(--space-x6);
    }

    .time-dialog__input {
      width: 100%;
      min-height: var(--control-height-large);
      margin-top: var(--space-x5);
      padding: var(--space-x3) var(--space-x4);
      text-align: center;
      font-size: var(--text-page-title-size);
      font-variant-numeric: tabular-nums;
    }

    @keyframes schedule-added {
      0% { background: var(--bg-brand-weak); transform: translateY(var(--space-x1)); }
      55% { background: color-mix(in srgb, var(--bg-brand-weak) 58%, var(--bg-layer-default)); }
      100% { background: var(--bg-layer-default); transform: translateY(0); }
    }

    .edit-tools__actions {
      display: flex;
      align-items: end;
      gap: var(--space-x1);
    }

    .discovery-prompt {
      margin: calc(var(--space-x3) * -1) var(--space-x0) var(--space-x6);
      font-size: var(--text-item-title-size);
      font-weight: var(--font-weight-bold);
      line-height: var(--text-item-title-line);
    }

    #placeDialog .sheet-tabs {
      display: flex;
      width: 100%;
      gap: var(--space-x1);
      padding: var(--space-x1);
      overflow: visible;
      margin-bottom: var(--space-x5);
      border-radius: var(--radius-md);
      background: var(--bg-neutral-subtle);
    }

    #placeDialog .sheet-tabs .ui-tab {
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: var(--control-height-medium);
      padding-inline: var(--space-x3);
      border: 0;
      border-radius: calc(var(--radius-md) - var(--space-x1));
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    #placeDialog .sheet-tabs .ui-tab[aria-selected="true"] {
      border: 0;
      background: var(--bg-layer-default);
