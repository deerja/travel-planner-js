      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .roamly-schedule-item .place-copy p {
      display: -webkit-box;
      overflow: hidden;
      margin-top: var(--space-x1);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      line-height: var(--text-label-line);
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .schedule-card-actions {
      display: flex;
      grid-row: 1;
      grid-column: 2;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-x2);
      margin-top: var(--space-x0);
    }

    .schedule-card-actions .directions,
    .schedule-card.has-status .schedule-card-actions .directions {
      grid-row: auto;
      grid-column: auto;
      width: var(--control-height-small);
      min-height: var(--control-height-small);
      padding: var(--space-x2);
      border-color: transparent;
      background: transparent;
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
    }

    .schedule-card-actions .directions:hover {
      background: var(--bg-brand-weak);
    }

    .schedule-card-actions .directions__icon {
      width: var(--icon-size-md);
      height: var(--icon-size-md);
    }

    .directions__label {
      display: none;
    }

    .schedule-card-actions .ui-button {
      min-height: var(--control-height-small);
      font-size: var(--text-caption-size);
    }

    .schedule-card.has-status .schedule-card-body {
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      min-height: 5.25rem;
    }

    .schedule-card.has-status .schedule-card-actions {
      grid-row: auto;
      grid-column: 1;
      justify-content: flex-start;
      margin-top: var(--space-x3);
    }

    .schedule-card.has-status .schedule-card-actions .directions {
      width: auto;
      padding-inline: var(--space-x3);
    }

    .schedule-card.has-status .directions__label {
      display: inline;
    }

    .roamly-schedule-item.is-editing .schedule-card-body {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      min-height: 5.25rem;
    }

    .roamly-schedule-item.is-editing .place-copy {
      grid-row: 1;
      grid-column: 1;
      padding-right: var(--space-x2);
    }

    .roamly-schedule-item.is-editing .next-schedule-badge {
      grid-row: 1;
      grid-column: 1 / -1;
    }

    .roamly-schedule-item.is-editing .next-schedule-badge + .place-copy {
      grid-row: 2;
    }

    .roamly-schedule-item.is-editing .schedule-edit-actions {
      grid-row: 1;
      grid-column: 2;
      flex-wrap: nowrap;
      align-self: end;
      justify-self: end;
      justify-content: flex-end;
      gap: var(--space-x0);
      margin: var(--space-x0) calc(var(--space-x2) * -1) var(--space-x0) var(--space-x0);
    }

    .roamly-schedule-item.is-editing .next-schedule-badge ~ .schedule-edit-actions {
      grid-row: 2;
    }

    .schedule-edit-actions .ui-icon-button {
      width: var(--control-height-small);
      height: var(--control-height-small);
      min-width: var(--control-height-small);
      min-height: var(--control-height-small);
      border-color: transparent;
      background: transparent;
    }

    .edit-info-button {
      color: var(--fg-neutral-muted);
    }

    .edit-info-button:hover {
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral-subtle);
    }

    .edit-delete-button {
      color: var(--fg-neutral-muted);
    }

    .edit-delete-button:hover {
      background: var(--bg-neutral-subtle);
      color: var(--fg-neutral-subtle);
    }

    .edit-action__icon {
      width: var(--icon-size-md);
      height: var(--icon-size-md);
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .drag-handle {
      display: inline-grid;
      grid-row: 1;
      grid-column: 3;
      width: var(--control-height-small);
      height: var(--control-height-small);
      margin-top: var(--space-x3);
      place-items: center;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg-neutral-muted);
      font-size: var(--text-item-title-size);
      line-height: 1;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
      background: var(--bg-neutral-subtle);
    }

    .edit-reorder-actions {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .edit-reorder-actions:focus-within {
      display: flex;
      position: absolute;
      z-index: 5;
      top: 3.25rem;
      right: var(--space-x0);
      width: auto;
      height: auto;
      padding: var(--space-x1);
      overflow: visible;
      clip: auto;
      clip-path: none;
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
      box-shadow: var(--elevation-floating);
      white-space: normal;
    }

    .schedule-entry.is-dragging {
      z-index: 50;
      pointer-events: none;
    }

    .schedule-entry.is-dragging .schedule-card {
      box-shadow: var(--elevation-overlay);
      transform: scale(0.985);
    }

    .schedule-drop-placeholder {
      min-height: 8rem;
      margin: 0 3rem 0 var(--timeline-rail-width);
      border: var(--stroke-width-thin) dashed var(--stroke-brand);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--bg-brand-weak) 42%, transparent);
    }

    body.is-schedule-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .place-info-dialog {
      width: min(32rem, calc(100% - (var(--layout-gutter-mobile) * 2)));
    }

    .place-info-dialog .modal {
      padding: var(--space-x6);
    }

    .place-info-meta {
      margin: var(--space-x2) var(--space-x0) var(--space-x5);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
    }

    .place-info-field {
      display: grid;
      gap: var(--space-x2);
      margin-top: var(--space-x4);
      color: var(--fg-neutral);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .place-info-field small {
      color: var(--fg-neutral-muted);
      font-size: var(--font-size-t2);
      font-weight: var(--font-weight-regular);
    }

    .place-info-field textarea {
      min-height: 5.5rem;
      padding-block: var(--space-x3);
      resize: vertical;
    }

    .place-info-dialog .form-actions {
      margin-top: var(--space-x6);
    }

    @media (min-width: 40rem) {
      .schedule-card {
        display: grid;
        grid-template-columns: minmax(10rem, 34%) minmax(0, 1fr);
      }

      .place-visual {
        grid-row: 1;
        grid-column: 1;
        height: 100%;
        max-height: none;
        min-height: 10rem;
        aspect-ratio: auto;
      }

      .schedule-card-body {
        grid-row: 1;
        grid-column: 2;
        grid-template-columns: minmax(0, 1fr);
        align-content: center;
        align-items: start;
        min-height: 10rem;
        padding: var(--space-x5);
      }

      .schedule-card-actions {
        grid-row: auto;
        grid-column: 1;
        justify-content: flex-start;
        margin-top: var(--space-x3);
      }

      .schedule-card-actions .directions,
      .schedule-card.has-status .schedule-card-actions .directions {
        width: auto;
        padding-inline: var(--space-x3);
      }

      .directions__label {
        display: inline;
      }
    }

    @media (max-width: 39.9375rem) {
      .place-visual[data-photo-state="unavailable"] {
        height: 8.875rem;
        aspect-ratio: auto;
      }

      .roamly-day-navigation {
        margin-top: var(--space-x4);
        padding-top: var(--space-x0);
      }

      .roamly-schedule {
        margin-top: calc(var(--space-x6) + 20px);
      }

      .roamly-schedule {
        --timeline-rail-width: 3.5rem;
      }

      .schedule-card-body {
        padding: var(--space-x4);
      }

      .roamly-schedule-item.is-editing {
        grid-template-columns: var(--timeline-rail-width) minmax(0, 1fr) 2rem;
      }

      .drag-handle {
        width: 2rem;
        height: 2rem;
      }

      .place-info-dialog {
        width: 100%;
      }

      .place-info-dialog .ui-sheet-handle {
        display: block;
      }

      .place-info-dialog .modal {
        padding: var(--space-x5) var(--space-x5) calc(var(--space-x6) + env(safe-area-inset-bottom));
      }
    }

    @media (max-width: 23.75rem) {
      .roamly-schedule {
        --timeline-rail-width: 3rem;
      }

      .schedule-card-body {
        padding: var(--space-x4);
      }

      .schedule-card-actions {
        gap: var(--space-x1);
      }

      .schedule-card-actions .ui-button {
        padding-inline: var(--space-x2);
      }
    }

    /* Trip setup dialog */
    .trip-dialog {
      width: min(calc(100% - (var(--layout-gutter-mobile) * 2)), 42rem);
      max-height: min(92dvh, 54rem);
    }

    .trip-dialog .modal {
      padding: var(--space-x7, 1.75rem) var(--space-x7, 1.75rem) var(--space-x6);
    }

    .trip-modal-head {
      margin-bottom: var(--space-x6);
    }

    .trip-modal-head p {
      margin-top: var(--space-x2);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      line-height: var(--text-label-line);
    }

    .trip-form {
      gap: var(--space-x5);
    }

    .trip-form-section {
      display: grid;
      gap: var(--space-x4);
      padding: var(--space-x5);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-lg);
      background: var(--bg-layer-default);
    }

    .trip-form-section__head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-x3);
    }

    .trip-form-section__head > span {
      display: inline-grid;
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 auto;
      place-items: center;
      border-radius: var(--radius-full);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
    }

    .trip-form-section__head h3 {
      color: var(--fg-neutral);
      font-size: var(--text-item-title-size);
      font-weight: var(--text-item-title-weight);
      line-height: var(--text-item-title-line);
    }

    .trip-form-section__head p {
      margin-top: var(--space-x1);
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      line-height: var(--text-caption-line);
    }

    .trip-form .trip-field {
      position: relative;
      display: grid;
      min-width: 0;
      gap: var(--space-x2);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
    }

    .trip-field > span {
      display: flex;
      align-items: baseline;
      gap: var(--space-x1);
    }

    .trip-field > span small,
    .accommodation-field > small {
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-regular);
    }

    .destination-fields,
    .flight-builder {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-x4);
    }

    .trip-combobox {
      position: relative;
      min-width: 0;
    }

    .trip-combobox::after {
      position: absolute;
      top: 50%;
      right: var(--space-x4);
      color: var(--fg-neutral-muted);
      content: "⌄";
      font-size: 1.25rem;
      line-height: 1;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .trip-combobox > input {
      padding-right: var(--space-x9);
    }

    .trip-search-combobox > .ui-text-field {
      padding-left: 2.75rem;
    }

    .trip-combobox-search-icon {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: var(--space-x4);
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: var(--fg-neutral-muted);
      stroke-linecap: round;
      stroke-width: 1.9;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .destination-coverage {
      display: flex;
      align-items: center;
      gap: var(--space-x2);
      margin-top: calc(var(--space-x1) * -1);
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      line-height: var(--text-caption-line);
    }

    .destination-coverage::before {
      color: var(--fg-brand);
      content: "✓";
      font-weight: var(--font-weight-bold);
    }

    .trip-suggestions {
      position: absolute;
      z-index: 30;
      top: calc(100% + var(--space-x1));
      right: 0;
      left: 0;
      max-height: 13rem;
      overflow-y: auto;
      padding: var(--space-x1);
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-layer-floating);
      box-shadow: var(--elevation-floating);
    }

    .trip-suggestions[hidden] {
      display: none;
    }

    .trip-suggestion {
      display: flex;
      width: 100%;
      min-height: var(--control-height-medium);
      align-items: center;
      justify-content: space-between;
      gap: var(--space-x3);
      padding: var(--space-x2) var(--space-x3);
      border-radius: calc(var(--radius-md) - var(--space-x1));
      color: var(--fg-neutral);
      text-align: left;
    }

    .trip-suggestion:hover,
    .trip-suggestion.is-active {
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
    }

    .trip-suggestion small {
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      white-space: nowrap;
    }

    .trip-suggestion-summary {
      padding: var(--space-x2) var(--space-x3);
      border-top: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      line-height: var(--text-caption-line);
    }

    .trip-date-range {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-x4);
      padding: var(--space-x0);
      border-radius: var(--space-x0);
      background: transparent;
    }

    .trip-date-range .ui-text-field {
      background: var(--bg-layer-default);
    }

    .trip-form input[type="date"],
    .trip-form input[type="time"] {
      min-height: var(--control-height-large);
      padding-block: var(--space-x3);
    }

    .trip-form input[type="date"]::-webkit-calendar-picker-indicator,
    .trip-form input[type="time"]::-webkit-calendar-picker-indicator {
      width: 1.25rem;
      height: 1.25rem;
      margin: var(--space-x0);
      padding: var(--space-x1);
      opacity: 0.82;
      cursor: pointer;
      transform: scale(1.08);
      transform-origin: center;
    }

    .trip-form-title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-x2);
    }

    .trip-duration-badge {
      display: inline-flex;
      min-height: 1.5rem;
      align-items: center;
      padding-inline: var(--space-x2);
      border-radius: var(--radius-full);
      background: var(--bg-brand-weak);
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
      line-height: 1;
      white-space: nowrap;
    }

    .trip-duration-badge[hidden] {
      display: none;
    }

    .flight-builder {
      align-items: end;
    }

    .flight-route {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(6.5rem, .75fr) auto minmax(0, 1.2fr) minmax(6.5rem, .75fr);
      align-items: end;
      gap: var(--space-x2);
      padding-top: var(--space-x2);
    }

    .flight-route > i {
      align-self: center;
      padding-top: var(--space-x5);
      color: var(--fg-neutral-muted);
      font-style: normal;
    }

    .trip-search-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-x2);
    }

    .trip-search-control .ui-button {
      min-width: 4.25rem;
    }

    .accommodation-field {
      grid-column: 1 / -1;
      margin-top: var(--space-x1);
    }

    .accommodation-results {
      overflow: hidden;
      border: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
    }

    .accommodation-results[hidden] {
      display: none;
    }

    .accommodation-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      width: 100%;
      gap: var(--space-x3);
      padding: var(--space-x3) var(--space-x4);
      border-bottom: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      color: var(--fg-neutral);
      text-align: left;
    }

    .accommodation-result:last-child {
      border-bottom: 0;
    }

    .accommodation-result:hover {
      background: var(--bg-neutral-subtle);
    }

    .accommodation-result strong,
    .accommodation-result small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .accommodation-result small {
      margin-top: var(--space-x1);
      color: var(--fg-neutral-muted);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-regular);
    }

    .accommodation-result > span:last-child {
      align-self: center;
      color: var(--fg-brand);
      font-size: var(--text-caption-size);
      font-weight: var(--font-weight-bold);
      white-space: nowrap;
    }

    .accommodation-search-state {
      padding: var(--space-x4);
      color: var(--fg-neutral-subtle);
      font-size: var(--text-caption-size);
      text-align: center;
    }

    .trip-budget-section {
      padding: var(--space-x5);
      background: var(--bg-layer-default);
    }

    .budget-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      overflow: hidden;
      border: var(--stroke-width-thin) solid var(--stroke-neutral);
      border-radius: var(--radius-md);
      background: var(--bg-layer-default);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .budget-field > span {
      display: flex;
      min-height: var(--control-height-medium);
      align-self: stretch;
      align-items: center;
      justify-content: center;
      min-width: 3.5rem;
      padding-inline: var(--space-x4);
      border-left: var(--stroke-width-thin) solid var(--stroke-neutral-subtle);
      background: var(--bg-layer-default);
      color: var(--fg-neutral-muted);
      font-size: var(--text-label-size);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .budget-field > input {
      min-width: 0;
      min-height: var(--control-height-large);
      padding-right: var(--space-x4);
      border: 0 !important;
      border-radius: var(--space-x0) !important;
      background: var(--bg-layer-default) !important;
      appearance: textfield;
      text-align: right;
      box-shadow: none !important;
    }

    .budget-field > input::-webkit-inner-spin-button,
    .budget-field > input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .budget-field:focus-within {
      border-color: var(--stroke-brand);
      box-shadow: var(--focus-ring);
    }

    .budget-field > input:focus {
      border: 0 !important;
      outline: 0;
      box-shadow: none !important;
    }

    .trip-form-actions {
      position: sticky;
      z-index: 20;
      bottom: calc(var(--space-x6) * -1);
      padding-top: var(--space-x3);
      padding-bottom: var(--space-x1);
      background: linear-gradient(180deg, transparent, var(--bg-layer-floating) 24%);
    }

    @media (max-width: 39.9375rem) {
      .trip-dialog {
        width: 100%;
        max-width: none;
        max-height: 94dvh;
        margin: auto var(--space-x0) var(--space-x0);
        border-radius: var(--radius-xl) var(--radius-xl) var(--space-x0) var(--space-x0);
      }

      .trip-dialog .modal {
        padding: var(--space-x5) var(--space-x5) calc(var(--space-x5) + env(safe-area-inset-bottom));
      }

      .destination-fields,
      .flight-builder {
        grid-template-columns: 1fr;
      }

      .flight-route {
        grid-template-columns: minmax(0, 1fr) minmax(6.5rem, .72fr);
      }

      .flight-route > i {
        display: none;
      }

      .trip-form-section {
        padding: var(--space-x4);
      }

      .trip-form-actions {
        bottom: calc((var(--space-x5) + env(safe-area-inset-bottom)) * -1);
      }
    }

    /* Home / My Trips */
    .trips-shell {
      max-width: 58rem;
    }

    .trips-shell .topbar {
      min-height: 4.5rem;
    }

    .my-trips-head {
      align-items: center;
      padding-block: var(--space-x8) var(--space-x10);
    }

    .my-trips-head h1 {
      margin-top: var(--space-x0);
    }

    .my-trips-head p {
      margin-top: var(--space-x2);
    }

    .my-trips-head .ui-button {

    const REVIEW_MODES=new Set(['home','trip','schedule-edit','place-add','full-map']);
    function getReviewRequest(){
      if(ROAMLY_CONFIG.environment!=='development')return null;
      const params=new URLSearchParams(location.search),mode=params.get('review');
      if(!REVIEW_MODES.has(mode))return null;
      return{mode,tripId:params.get('trip')||'',dayValue:params.get('day')||''}
    }
    function resolveReviewDay(trip,value){
      if(!trip)return null;
      const target=String(value||'').trim();
      return trip.days.find(day=>String(day.day)===target||day.id===target)||trip.days[0]||null
    }
    function initializeApp(){
      const review=getReviewRequest();
      if(!review||review.mode==='home'){renderTrips();return}
      const trip=db.trips.find(item=>item.id===review.tripId),day=resolveReviewDay(trip,review.dayValue);
      if(!trip||!day){renderTrips();return}
      state.activeTripId=trip.id;
      state.activeDayId=day.id;
      state.selectedPlaceId=day.places[0]?.id||null;
      state.editMode=review.mode==='schedule-edit';
      state.mapExpanded=false;
      renderDetail();
      if(review.mode==='place-add')requestAnimationFrame(openPlaceDialog);
      if(review.mode==='full-map')requestAnimationFrame(openFullMap)
    }
